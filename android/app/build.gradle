apply plugin: 'com.android.application'

def loadifyUploadStoreFile = project.findProperty('LOADIFY_UPLOAD_STORE_FILE') ?: System.getenv('LOADIFY_UPLOAD_STORE_FILE')
def loadifyUploadKeyAlias = project.findProperty('LOADIFY_UPLOAD_KEY_ALIAS') ?: System.getenv('LOADIFY_UPLOAD_KEY_ALIAS')
def loadifyUploadStorePassword = project.findProperty('LOADIFY_UPLOAD_STORE_PASSWORD') ?: System.getenv('LOADIFY_UPLOAD_STORE_PASSWORD')
def loadifyUploadKeyPassword = project.findProperty('LOADIFY_UPLOAD_KEY_PASSWORD') ?: System.getenv('LOADIFY_UPLOAD_KEY_PASSWORD')
def loadifyReleaseSigningValues = [
    loadifyUploadStoreFile,
    loadifyUploadKeyAlias,
    loadifyUploadStorePassword,
    loadifyUploadKeyPassword,
]
def loadifyReleaseSigningConfigured = loadifyReleaseSigningValues.every { value -> value != null && value.toString().trim() }
def loadifyReleaseSigningPartiallyConfigured = loadifyReleaseSigningValues.any { value -> value != null && value.toString().trim() } && !loadifyReleaseSigningConfigured

if (loadifyReleaseSigningPartiallyConfigured) {
    throw new GradleException('Loadify release signing is partially configured. Set all four LOADIFY_UPLOAD_* properties or none of them.')
}

android {
    namespace = "co.uk.loadifymarket.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "co.uk.loadifymarket.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (loadifyReleaseSigningConfigured) {
            release {
                storeFile file(loadifyUploadStoreFile)
                storePassword loadifyUploadStorePassword
                keyAlias loadifyUploadKeyAlias
                keyPassword loadifyUploadKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (loadifyReleaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

def servicesJSON = file('google-services.json')
def googleServicesConfigured = servicesJSON.exists() && servicesJSON.length() > 0
def releaseTaskRequested = gradle.startParameter.taskNames.any { taskName ->
    taskName.toLowerCase().contains('release')
}

if (googleServicesConfigured) {
    apply plugin: 'com.google.gms.google-services'
} else if (releaseTaskRequested) {
    throw new GradleException(
        'google-services.json is required for Loadify Android release builds. ' +
        'Inject android/app/google-services.json from CI/local secure configuration before assembleRelease or bundleRelease.'
    )
} else {
    logger.info("google-services.json not found, google-services plugin not applied for non-release task")
}
