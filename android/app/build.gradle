apply plugin: 'com.android.application'

// Explicit process environment values take precedence over Gradle properties.
// This matters on recovery/build machines that may still have historical
// LOADIFY_UPLOAD_* entries in ~/.gradle/gradle.properties. The local release
// preflight validates the explicit environment-selected keystore, so Gradle
// must resolve signing inputs using the same precedence rule.
def loadifyUploadStoreFile = System.getenv('LOADIFY_UPLOAD_STORE_FILE') ?: project.findProperty('LOADIFY_UPLOAD_STORE_FILE')
def loadifyUploadKeyAlias = System.getenv('LOADIFY_UPLOAD_KEY_ALIAS') ?: project.findProperty('LOADIFY_UPLOAD_KEY_ALIAS')
def loadifyUploadStorePassword = System.getenv('LOADIFY_UPLOAD_STORE_PASSWORD') ?: project.findProperty('LOADIFY_UPLOAD_STORE_PASSWORD')
def loadifyUploadKeyPassword = System.getenv('LOADIFY_UPLOAD_KEY_PASSWORD') ?: project.findProperty('LOADIFY_UPLOAD_KEY_PASSWORD')
def loadifyReleaseSigningValues = [
    loadifyUploadStoreFile,
    loadifyUploadKeyAlias,
    loadifyUploadStorePassword,
    loadifyUploadKeyPassword,
]
def loadifyReleaseSigningConfigured = loadifyReleaseSigningValues.every { value -> value != null && value.toString().trim() }
def loadifyReleaseSigningPartiallyConfigured = loadifyReleaseSigningValues.any { value -> value != null && value.toString().trim() } && !loadifyReleaseSigningConfigured

if (loadifyReleaseSigningPartiallyConfigured) {
    throw new GradleException('Loadify release signing is partially configured. Set all four LOADIFY_UPLOAD_* properties or none of them.')
}

android {
    namespace = "co.uk.loadifymarket.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "co.uk.loadifymarket.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Historical signed/public builds use versionCode 1. Reserve the next
        // integer for the preserved-app recovery candidate so Android can treat
        // it as an update rather than a same-version replacement.
        versionCode 2
        versionName "1.0.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (loadifyReleaseSigningConfigured) {
            release {
                storeFile file(loadifyUploadStoreFile)
                storePassword loadifyUploadStorePassword
                keyAlias loadifyUploadKeyAlias
                keyPassword loadifyUploadKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (loadifyReleaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

def servicesJSON = file('google-services.json')
def googleServicesConfigured = servicesJSON.exists() && servicesJSON.length() > 0
def androidPackageTaskRequested = gradle.startParameter.taskNames.any { taskName ->
    def normalized = taskName.toLowerCase()
    normalized.contains('assemble') ||
        normalized.contains('bundle') ||
        normalized.contains('install') ||
        normalized.contains('package')
}

if (googleServicesConfigured) {
    apply plugin: 'com.google.gms.google-services'
} else if (androidPackageTaskRequested) {
    throw new GradleException(
        'google-services.json is required for Loadify Android APK/AAB build and install tasks. ' +
        'Inject android/app/google-services.json from CI/local secure configuration before building or installing the app.'
    )
} else {
    logger.info("google-services.json not found; packaging/install tasks will fail closed until secure Firebase configuration is injected")
}
