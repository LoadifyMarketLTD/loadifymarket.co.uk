<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 38" role="img" aria-label="Google Pay">
  <!-- White card background -->
  <rect width="80" height="38" rx="4" fill="#ffffff" stroke="#e5e7eb" stroke-width="0.75"/>

  <!-- Google "G" — colourful lettermark using official Google brand colours -->
  <!-- Blue arc (top) -->
  <path d="M18 19 A7 7 0 1 1 12.02 22.5" fill="none" stroke="#4285F4" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Red arc (left-bottom) -->
  <path d="M12.02 22.5 A7 7 0 0 1 11 19" fill="none" stroke="#EA4335" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Yellow arc (bottom) -->
  <path d="M11 19 A7 7 0 0 1 14.26 13.74" fill="none" stroke="#FBBC05" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Green arc (top-left) -->
  <path d="M14.26 13.74 A7 7 0 0 1 18 12" fill="none" stroke="#34A853" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Horizontal bar of the G -->
  <line x1="18" y1="19" x2="24" y2="19" stroke="#4285F4" stroke-width="3.5" stroke-linecap="round"/>

  <!-- "Pay" wordmark -->
  <!-- G -->
  <text
    x="31" y="24"
    font-family="Arial, Helvetica, 'Liberation Sans', sans-serif"
    font-weight="500"
    font-size="13"
    fill="#3c4043"
    text-anchor="start"
    letter-spacing="-0.2"
  >Pay</text>
</svg>
