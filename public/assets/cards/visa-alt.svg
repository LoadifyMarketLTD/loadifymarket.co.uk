<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 38" role="img" aria-label="Visa">
  <!-- Flat white card with subtle shadow border -->
  <rect width="60" height="38" rx="4" fill="#ffffff" stroke="#e5e7eb" stroke-width="0.75"/>
  <!-- VISA wordmark — italic serif style in Visa Navy -->
  <text
    x="30" y="27"
    font-family="Times New Roman, Georgia, 'DejaVu Serif', serif"
    font-weight="700"
    font-style="italic"
    font-size="17"
    fill="#1A1F71"
    text-anchor="middle"
    letter-spacing="1.5"
  >VISA</text>
</svg>
