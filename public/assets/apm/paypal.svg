<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 38" role="img" aria-label="PayPal">
  <!-- White card background -->
  <rect width="60" height="38" rx="4" fill="#ffffff" stroke="#e5e7eb" stroke-width="0.75"/>

  <!-- "PP" two-letter overlapping monogram -->
  <!-- Back P — sky blue, offset right -->
  <text
    x="22.5" y="25"
    font-family="Arial, Helvetica, 'Liberation Sans', sans-serif"
    font-weight="900"
    font-size="17"
    fill="#009CDE"
    text-anchor="middle"
  >P</text>
  <!-- Front P — deep navy, offset left -->
  <text
    x="19" y="23"
    font-family="Arial, Helvetica, 'Liberation Sans', sans-serif"
    font-weight="900"
    font-size="17"
    fill="#003087"
    text-anchor="middle"
  >P</text>

  <!-- "PayPal" wordmark to the right of the monogram -->
  <text
    x="36" y="23"
    font-family="Arial, Helvetica, 'Liberation Sans', sans-serif"
    font-weight="700"
    font-size="8"
    fill="#003087"
    text-anchor="middle"
    letter-spacing="-0.1"
  >Pay</text>
  <text
    x="36" y="32"
    font-family="Arial, Helvetica, 'Liberation Sans', sans-serif"
    font-weight="700"
    font-size="8"
    fill="#009CDE"
    text-anchor="middle"
    letter-spacing="-0.1"
  >Pal</text>
</svg>
