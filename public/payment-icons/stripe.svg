<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 38" role="img" aria-label="Stripe">
  <!-- Stripe Blurple gradient -->
  <defs>
    <linearGradient id="stripe-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C74FF"/>
      <stop offset="100%" stop-color="#635BFF"/>
    </linearGradient>
  </defs>
  <rect width="60" height="38" rx="4" fill="url(#stripe-grad)"/>
  <!-- "stripe" lowercase wordmark -->
  <text
    x="30" y="23"
    font-family="Arial, Helvetica, 'Liberation Sans', sans-serif"
    font-weight="bold" font-size="13"
    fill="#ffffff" text-anchor="middle" letter-spacing="0.5"
  >stripe</text>
  <!-- Subtle shine line at top -->
  <rect x="0" y="0" width="60" height="2" rx="2" fill="#ffffff" opacity="0.15"/>
</svg>
