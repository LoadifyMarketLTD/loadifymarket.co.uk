<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 38 24" role="img" aria-labelledby="stripe-title">
  <title id="stripe-title">Stripe</title>
  <!--
    Stripe payment processor badge.
    Background: Stripe Blurple #635BFF (official brand color)
    Wordmark: "stripe" lowercase bold in Arial (universally available).
    Stripe's own brand guide uses lowercase for the wordmark.
    Arial is the closest freely available approximation to the
    Stripe wordmark font at small badge sizes.
  -->
  <rect width="38" height="24" rx="3" fill="#635BFF"/>
  <text
    x="19"
    y="16"
    font-family="Arial, Helvetica, 'Liberation Sans', sans-serif"
    font-weight="bold"
    font-size="10"
    fill="#ffffff"
    text-anchor="middle"
    letter-spacing="0.3"
  >stripe</text>
</svg>
