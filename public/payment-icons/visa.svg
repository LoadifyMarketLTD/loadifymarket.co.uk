<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 38" role="img" aria-label="Visa">
  <rect width="60" height="38" rx="4" fill="#ffffff"/>
  <!-- Navy top band -->
  <rect y="0" width="60" height="11" rx="0" fill="#1A1F71"/>
  <rect y="0" width="60" height="6" rx="4" fill="#1A1F71"/>
  <!-- Gold accent line -->
  <rect y="11" width="60" height="2.5" fill="#F7A800"/>
  <!-- VISA wordmark -->
  <text
    x="30" y="30"
    font-family="Arial, Helvetica, 'Liberation Sans', sans-serif"
    font-weight="900" font-size="15"
    fill="#1A1F71" text-anchor="middle" letter-spacing="2"
  >VISA</text>
</svg>
