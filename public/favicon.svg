<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" fill="none" role="img" aria-label="Loadify Market">
  <defs>
    <linearGradient id="lm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#1E1A0E"/>
      <stop offset="100%" stop-color="#111216"/>
    </linearGradient>
    <linearGradient id="lm-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#F5D06E"/>
      <stop offset="100%" stop-color="#C8860A"/>
    </linearGradient>
  </defs>
  <!-- Dark rounded-square background -->
  <rect x="1" y="1" width="46" height="46" rx="10" ry="10" fill="url(#lm-bg)" stroke="#F2B84B" stroke-width="1.5"/>
  <!-- "LM" lettering in gold -->
  <text x="24" y="32" font-family="'Arial Black', 'Impact', sans-serif"
        font-size="20" font-weight="900" fill="url(#lm-gold)"
        text-anchor="middle" letter-spacing="1">LM</text>
</svg>
