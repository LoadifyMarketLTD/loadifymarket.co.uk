name: Generate Release Keystore

# Run this workflow ONCE when you need a brand-new signing keystore.
#
# Prerequisites — set these two secrets first (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_PASSWORD   strong password for the keystore file
#   ANDROID_KEY_PASSWORD        strong password for the private key inside the keystore
#
# After the workflow completes:
#   1. Download the "loadify-release-keystore" artifact (kept for 1 day)
#   2. On your machine:  base64 -w 0 loadify-release.keystore
#   3. Copy the output and set it as the ANDROID_KEYSTORE_BASE64 secret
#   4. Set ANDROID_KEY_ALIAS to the alias you entered below (default: loadify-release)
#
# The "Build Android APK" workflow will then be able to sign the release APK.

on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: 'Signing key alias (stored inside the keystore)'
        required: true
        default: 'loadify-release'
      validity_days:
        description: 'Key validity in days (10000 ≈ 27 years)'
        required: true
        default: '10000'
      dname:
        description: 'Distinguished Name  e.g.  CN=Loadify Market,O=LoadifyMarketLTD,C=GB'
        required: true
        default: 'CN=Loadify Market,O=LoadifyMarketLTD,C=GB'

permissions:
  contents: read

jobs:
  generate:
    name: Generate Keystore
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # ── Java (provides keytool) ───────────────────────────────────────────────
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # ── Guard: passwords must already exist as secrets ────────────────────────
      - name: Check password secrets
        env:
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          [ -z "$STORE_PASS" ] && missing+=("ANDROID_KEYSTORE_PASSWORD")
          [ -z "$KEY_PASS" ]   && missing+=("ANDROID_KEY_PASSWORD")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "ERROR: Set these secrets before running this workflow:"
            for s in "${missing[@]}"; do echo "  - $s"; done
            echo ""
            echo "Settings → Secrets and variables → Actions"
            echo "Choose strong passwords. Use the SAME values later as your signing secrets."
            exit 1
          fi
          echo "Password secrets are present."

      # ── Generate keystore ─────────────────────────────────────────────────────
      - name: Generate keystore
        env:
          KEY_ALIAS: ${{ github.event.inputs.key_alias }}
          VALIDITY: ${{ github.event.inputs.validity_days }}
          DNAME: ${{ github.event.inputs.dname }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          keytool -genkey -v \
            -keystore loadify-release.keystore \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity "$VALIDITY" \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "$DNAME"

      # ── Output alias in the run summary (safe: no secrets) ────────────────────
      - name: Write alias to run summary
        env:
          KEY_ALIAS: ${{ github.event.inputs.key_alias }}
        run: |
          {
            echo "## Release keystore generated"
            echo ""
            echo "**Signing key alias:** \`$KEY_ALIAS\`"
            echo ""
            echo "Set repository secret \`ANDROID_KEY_ALIAS\` to exactly this value."
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Upload keystore as artifact (1-day retention) ─────────────────────────
      # Keep retention short — this file contains your signing private key.
      # Download it promptly, encode it as base64, then delete the artifact.
      - name: Upload keystore artifact
        uses: actions/upload-artifact@v7
        with:
          name: loadify-release-keystore
          path: loadify-release.keystore
          retention-days: 1
