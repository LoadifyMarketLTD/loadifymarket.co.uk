name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
      # Build APK automatically on the active diagnostics branch so every push
      # produces an artifact that can be installed and tested immediately.
      - 'copilot/build-signed-release-apk-another-one'
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'capacitor.config.ts'
      - 'package*.json'
      - 'vite.config.ts'
      - '.github/workflows/build-android.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      # VITE_* variables are baked into the JavaScript bundle by Vite at build
      # time. Always supply real values via repository secrets.
      # Required: VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
      # TEMPORARY: Build identity vars baked into the APK bundle so the login
      # page shows a visible build stamp for APK diagnostics.  Remove these
      # (and the corresponding UI code) once the fetch root cause is confirmed.
      VITE_BUILD_SHA: ${{ github.sha }}
      VITE_BUILD_NUMBER: ${{ github.run_number }}
      # VITE_BUILD_TIME is set by the "Set build timestamp" step below so it
      # is always a real UTC timestamp regardless of trigger type.
      # Keystore filename used consistently across decode + build steps.
      RELEASE_KEYSTORE_FILENAME: loadify-release.keystore

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────────
      - uses: actions/checkout@v6

      # ── Node.js ───────────────────────────────────────────────────────────────
      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      # ── Set build timestamp ────────────────────────────────────────────────────
      # Sets VITE_BUILD_TIME in the workflow env so Vite bakes it into the bundle
      # as the APK build stamp.  Uses date rather than head_commit.timestamp so it
      # is always present regardless of the workflow trigger type.
      - name: Set build timestamp
        run: echo "VITE_BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      # ── Guard: require real Supabase credentials ───────────────────────────────
      # VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY are baked into the bundle at
      # build time. If they are missing the APK will contain wrong credentials and
      # all authentication will fail at runtime.
      - name: Verify required secrets are set
        run: |
          missing=()
          [ -z "$VITE_SUPABASE_URL" ]      && missing+=("VITE_SUPABASE_URL")
          [ -z "$VITE_SUPABASE_ANON_KEY" ] && missing+=("VITE_SUPABASE_ANON_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "ERROR: The following required secrets are not set:"
            for s in "${missing[@]}"; do echo "  - $s"; done
            echo ""
            echo "Add them under: GitHub repo → Settings → Secrets and variables → Actions"
            echo "Without these, the APK will have broken authentication."
            exit 1
          fi
          VITE_SUPABASE_URL_TRIMMED="$(echo -n "$VITE_SUPABASE_URL" | xargs)"
          if [[ "$VITE_SUPABASE_URL_TRIMMED" != https://* ]]; then
            echo "ERROR: VITE_SUPABASE_URL must start with https://"
            echo "  Current value starts with: ${VITE_SUPABASE_URL_TRIMMED:0:10}..."
            echo "Check the VITE_SUPABASE_URL secret under:"
            echo "  GitHub repo → Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL_TRIMMED" >> "$GITHUB_ENV"
          echo "All required secrets are present and valid."

      # ── Debug: confirm VITE_* env vars are present before build ───────────────
      - name: Debug VITE env vars
        run: |
          echo "SUPABASE URL set:        $([ -n "$VITE_SUPABASE_URL" ] && echo YES || echo NO)"
          echo "SUPABASE URL scheme:     ${VITE_SUPABASE_URL%%:*}://"
          echo "SUPABASE URL length:     ${#VITE_SUPABASE_URL}"
          echo "SUPABASE ANON KEY set:   $([ -n "$VITE_SUPABASE_ANON_KEY" ] && echo YES || echo NO)"
          echo "SUPABASE ANON KEY length:${#VITE_SUPABASE_ANON_KEY}"

      # ── Build web assets ───────────────────────────────────────────────────────
      - name: Build web app
        run: npm run build

      # ── Forensic check 1: dist/assets (pre-Capacitor-sync) ────────────────────
      # Searches the Vite-produced JavaScript bundle for strings that prove the
      # PR #361 mobileSafeFetch fix is present and keepalive usage is accounted for.
      #
      # NOTE ON MINIFICATION: Vite/Terser renames local function variables, so the
      # string "mobileSafeFetch" will NOT appear in a production bundle.  Instead we
      # detect its surviving minified fingerprint:
      #   - `global:{fetch:` — Supabase createClient global fetch override (string-preserved)
      #   - `"keepalive"in`  — the keepalive-stripping logic (string-preserved)
      # Together these two patterns prove the PR #361 fix is bundled.
      - name: '[Forensic 1] Inspect dist/assets (pre-cap-sync)'
        run: |
          echo "=================================================================="
          echo " FORENSIC INSPECTION 1: dist/assets/*.js (pre-cap-sync)"
          echo " Commit: ${{ github.sha }}"
          echo "=================================================================="
          PASS=true
          JS_FILES=$(find dist/assets -name "*.js" 2>/dev/null | grep -v '\.map$' | sort)
          if [ -z "$JS_FILES" ]; then
            echo "FAIL: No JS files found in dist/assets/"
            exit 1
          fi
          echo "Inspecting files:"
          echo "$JS_FILES" | while read -r f; do echo "  $f ($(du -sh "$f" | cut -f1))"; done
          echo ""

          # ── mobileSafeFetch (unminified / dev builds) ────────────────────────
          # In production Vite builds the function name is minified away; the
          # minification-robust checks below (global:{fetch + "keepalive"in) are
          # the authoritative proof.
          if grep -qr "mobileSafeFetch" dist/assets/*.js 2>/dev/null; then
            echo "PASS: mobileSafeFetch found verbatim (unminified or dev build)"
          else
            echo "INFO: mobileSafeFetch not found verbatim (expected in production/minified builds — see global:{fetch check below)"
          fi

          # ── global:{fetch: wrapper (minification-robust) ─────────────────────
          # This string IS preserved even after minification: createClient is called
          # with `global:{fetch:(e,t)=>{ ... keepalive ... }}`.
          if grep -qrP 'global:\{fetch:' dist/assets/*.js 2>/dev/null || \
             grep -qrP 'global\s*:\s*\{\s*fetch\s*:' dist/assets/*.js 2>/dev/null; then
            echo "PASS: global:{fetch: wrapper found in dist/assets — Supabase using custom fetch"
          else
            echo "FAIL: global:{fetch: wrapper NOT found in dist/assets"
            PASS=false
          fi

          # ── keepalive-stripping logic (minification-robust) ──────────────────
          # The string `"keepalive"in` survives minification because it is a
          # property lookup on an object, not a variable name.
          if grep -qr '"keepalive"in' dist/assets/*.js 2>/dev/null; then
            echo "PASS: keepalive-stripping logic (\"keepalive\"in) found in dist/assets — fix confirmed"
          else
            echo "FAIL: keepalive-stripping logic NOT found in dist/assets — PR #361 fix may be missing"
            PASS=false
          fi

          # ── createClient ─────────────────────────────────────────────────────
          if grep -qr "createClient" dist/assets/*.js 2>/dev/null; then
            echo "PASS: createClient found in dist/assets"
          else
            echo "FAIL: createClient NOT found in dist/assets"
            PASS=false
          fi

          # ── keepalive:true (the bad pattern) ─────────────────────────────────
          # After the PR #361 fix, keepalive:true must NOT appear anywhere.
          # The only allowed keepalive usage is inside the detection/stripping
          # block: `"keepalive"in t`.
          echo ""
          echo "--- keepalive:true occurrences (must be zero) ---"
          BAD=$(grep -rn 'keepalive\s*:\s*true\|keepalive:true' dist/assets/*.js 2>/dev/null || true)
          if [ -n "$BAD" ]; then
            echo "FAIL: keepalive:true found in dist/assets — Android WebView will crash:"
            echo "$BAD" | head -10
            PASS=false
          else
            echo "PASS: No keepalive:true found in dist/assets"
          fi

          # ── keepalive occurrences (informational) ────────────────────────────
          echo ""
          echo "--- All keepalive occurrences (informational) ---"
          KA=$(grep -rn "keepalive" dist/assets/*.js 2>/dev/null || true)
          if [ -n "$KA" ]; then
            echo "$KA" | head -10
            echo "(expected: only the stripping-detection pattern above)"
          else
            echo "No keepalive found at all"
          fi

          # ── window.fetch.bind as Supabase global option (the bad old pattern) ──
          # window.fetch.bind MAY legitimately appear inside our apkDiagnostics.ts
          # diagnostic wrapper (which uses it to capture the original fetch before
          # patching).  The only dangerous pattern is when it is used as the VALUE
          # of the Supabase createClient global:{fetch: option, i.e.:
          #   global:{fetch:window.fetch.bind(...)
          # That was the broken PR#345 pattern — not a bare occurrence of the string.
          if grep -qrP 'global:\{fetch:\s*window\.fetch\.bind' dist/assets/*.js 2>/dev/null; then
            echo "FAIL: Supabase global:{fetch: is set to window.fetch.bind — old broken pattern"
            grep -rn 'global:{fetch:.*window\.fetch\.bind' dist/assets/*.js | head -5
            PASS=false
          else
            echo "PASS: Supabase global:{fetch: does NOT use window.fetch.bind (OK: apkDiagnostics may use it internally)"
          fi

          # ── Failed to execute ────────────────────────────────────────────────
          if grep -qr "Failed to execute" dist/assets/*.js 2>/dev/null; then
            echo "INFO: 'Failed to execute' found in dist/assets (used in error-detection logic)"
            grep -rn "Failed to execute" dist/assets/*.js | head -5
          else
            echo "INFO: 'Failed to execute' not found in dist/assets"
          fi

          # ── errorTracking fetch fallback must not have keepalive ──────────────
          # The errorTracking.ts sendBeacon fallback used to have keepalive:true.
          # After the fix, it must not appear near sendBeacon/error-report patterns.
          echo ""
          echo "--- errorTracking keepalive check ---"
          if grep -qr "error-report\|sendBeacon\|\.netlify\/functions" dist/assets/*.js 2>/dev/null; then
            echo "INFO: errorTracking/sendBeacon code found in dist/assets"
            # The keepalive:true check above already covers this; no separate check needed.
          else
            echo "INFO: errorTracking not identifiable as separate symbol in minified bundle (expected)"
          fi

          echo ""
          echo "=================================================================="
          if [ "$PASS" = true ]; then
            echo " FORENSIC 1 RESULT: PASS — dist/assets bundle looks correct"
            echo "   ✓ global:{fetch: wrapper present (PR #361 Supabase fix)"
            echo "   ✓ keepalive-stripping logic present"
            echo "   ✓ no keepalive:true (errorTracking fix applied)"
            echo "   ✓ Supabase global:{fetch: not using window.fetch.bind"
          else
            echo " FORENSIC 1 RESULT: FAIL — see FAIL lines above"
            exit 1
          fi
          echo "=================================================================="

      # ── Scaffold Android project ───────────────────────────────────────────────
      # `npx cap add android` generates the full Android Gradle project from the
      # installed @capacitor/android template. No android/ directory needs to be
      # committed to the repository.
      - name: Scaffold Android platform
        run: npx cap add android

      # ── Ensure cordova.variables.gradle stub exists ────────────────────────────
      # When no Cordova plugins are installed, cap sync does not create this file,
      # but capacitor.build.gradle unconditionally applies it.
      - name: Ensure cordova.variables.gradle stub
        run: |
          mkdir -p android/capacitor-cordova-android-plugins
          if [ ! -f android/capacitor-cordova-android-plugins/cordova.variables.gradle ]; then
            echo "// No Cordova plugins — stub generated by CI" \
              > android/capacitor-cordova-android-plugins/cordova.variables.gradle
          fi

      # ── Capacitor sync ─────────────────────────────────────────────────────────
      - name: Sync Capacitor → Android
        run: npx cap sync android

      # ── Forensic check 2: Android assets (post-sync) ──────────────────────────
      - name: '[Forensic 2] Inspect android assets (post-cap-sync)'
        run: |
          echo "=================================================================="
          echo " FORENSIC INSPECTION 2: android/app/src/main/assets/public/assets"
          echo "=================================================================="
          ASSET_DIR="android/app/src/main/assets/public/assets"
          if [ ! -d "$ASSET_DIR" ]; then
            echo "WARN: $ASSET_DIR not found — cap sync may not have copied assets yet"
            echo "Listing android assets root:"
            find android/app/src/main/assets -name "*.js" 2>/dev/null | head -20 || true
          fi
          JS_FILES=$(find "$ASSET_DIR" -name "*.js" 2>/dev/null | grep -v '\.map$' | sort)
          if [ -z "$JS_FILES" ]; then
            echo "FAIL: No JS files found in $ASSET_DIR"
            exit 1
          fi
          echo "Inspecting files:"
          echo "$JS_FILES" | while read -r f; do echo "  $f ($(du -sh "$f" | cut -f1))"; done
          echo ""
          PASS=true

          if grep -qrP 'global:\{fetch:' "$ASSET_DIR"/*.js 2>/dev/null || \
             grep -qrP 'global\s*:\s*\{\s*fetch\s*:' "$ASSET_DIR"/*.js 2>/dev/null; then
            echo "PASS: global:{fetch: wrapper found in Android assets"
          else
            echo "FAIL: global:{fetch: wrapper NOT found in Android assets"
            PASS=false
          fi

          if grep -qr '"keepalive"in' "$ASSET_DIR"/*.js 2>/dev/null; then
            echo "PASS: keepalive-stripping logic (\"keepalive\"in) found in Android assets"
          else
            echo "FAIL: keepalive-stripping logic NOT found in Android assets — fix not synced!"
            PASS=false
          fi

          if grep -qr "createClient" "$ASSET_DIR"/*.js 2>/dev/null; then
            echo "PASS: createClient found in Android assets"
          else
            echo "FAIL: createClient NOT found in Android assets"
            PASS=false
          fi

          echo ""
          echo "--- keepalive:true occurrences in Android assets (must be zero) ---"
          BAD=$(grep -rn 'keepalive\s*:\s*true\|keepalive:true' "$ASSET_DIR"/*.js 2>/dev/null || true)
          if [ -n "$BAD" ]; then
            echo "FAIL: keepalive:true found in Android assets — Android WebView will crash:"
            echo "$BAD" | head -10
            PASS=false
          else
            echo "PASS: No keepalive:true found in Android assets"
          fi

          echo ""
          echo "--- All keepalive occurrences (informational) ---"
          KA=$(grep -rn "keepalive" "$ASSET_DIR"/*.js 2>/dev/null || true)
          if [ -n "$KA" ]; then
            echo "$KA" | head -10
          else
            echo "No keepalive found at all"
          fi

          if grep -qrP 'global:\{fetch:\s*window\.fetch\.bind' "$ASSET_DIR"/*.js 2>/dev/null; then
            echo "FAIL: Supabase global:{fetch: is set to window.fetch.bind — old broken pattern"
            grep -rn 'global:{fetch:.*window\.fetch\.bind' "$ASSET_DIR"/*.js | head -5
            PASS=false
          else
            echo "PASS: Supabase global:{fetch: does NOT use window.fetch.bind (OK: apkDiagnostics may use it internally)"
          fi

          echo ""
          echo "=================================================================="
          if [ "$PASS" = true ]; then
            echo " FORENSIC 2 RESULT: PASS — Android assets look correct"
            echo "   ✓ global:{fetch: wrapper present"
            echo "   ✓ keepalive-stripping logic present"
            echo "   ✓ no keepalive:true"
            echo "   ✓ Supabase global:{fetch: not using window.fetch.bind"
          else
            echo " FORENSIC 2 RESULT: FAIL — see FAIL lines above"
            exit 1
          fi
          echo "=================================================================="

      # ── Java 21 ───────────────────────────────────────────────────────────────
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # ── Android SDK ───────────────────────────────────────────────────────────
      - uses: android-actions/setup-android@v4

      # ── Gradle cache ──────────────────────────────────────────────────────────
      - uses: gradle/actions/setup-gradle@v6

      # ── Decode keystore ───────────────────────────────────────────────────────
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          [ -z "$ANDROID_KEYSTORE_BASE64" ]    && missing+=("ANDROID_KEYSTORE_BASE64")
          [ -z "$ANDROID_KEYSTORE_PASSWORD" ]  && missing+=("ANDROID_KEYSTORE_PASSWORD")
          [ -z "$ANDROID_KEY_ALIAS" ]          && missing+=("ANDROID_KEY_ALIAS")
          [ -z "$ANDROID_KEY_PASSWORD" ]       && missing+=("ANDROID_KEY_PASSWORD")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "ERROR: The following signing secrets are not set:"
            for s in "${missing[@]}"; do echo "  - $s"; done
            echo ""
            echo "Add them under: GitHub repo → Settings → Secrets and variables → Actions"
            echo "Without these the APK cannot be signed and will not be installable."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/$RELEASE_KEYSTORE_FILENAME
          echo "Keystore decoded successfully."

      # ── Validate keystore ─────────────────────────────────────────────────────
      - name: Validate keystore
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "Validating keystore: password and alias check..."
          if ! keytool -list \
              -keystore android/app/$RELEASE_KEYSTORE_FILENAME \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -alias "$ANDROID_KEY_ALIAS"; then
            echo ""
            echo "ERROR: Keystore validation failed. Possible causes:"
            echo "  - ANDROID_KEYSTORE_PASSWORD is incorrect"
            echo "  - ANDROID_KEY_ALIAS '${ANDROID_KEY_ALIAS}' does not exist in the keystore"
            echo "  - The base64-decoded keystore file is corrupt"
            exit 1
          fi
          echo "Keystore valid. Alias '${ANDROID_KEY_ALIAS}' confirmed."

      # ── Build release APK ──────────────────────────────────────────────────────
      # Pass signing configuration via Gradle properties so the generated
      # build.gradle does not need to be modified.
      - name: Build release APK
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/android/app/${{ env.RELEASE_KEYSTORE_FILENAME }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$KEYSTORE_FILE" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEYSTORE_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEYSTORE_KEY_PASSWORD"

      # ── List APK output ────────────────────────────────────────────────────────
      - name: List APK output directory
        run: ls -lah android/app/build/outputs/apk/release/

      # ── Verify signed APK exists ───────────────────────────────────────────────
      - name: Verify signed APK exists
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "ERROR: app-release.apk not found — signing was not applied."
            ls -lah android/app/build/outputs/apk/release/ || true
            exit 1
          fi
          echo "Signed APK confirmed: $APK ($(du -sh "$APK" | cut -f1))"

      # ── Verify APK signature ───────────────────────────────────────────────────
      - name: Verify APK signature
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name "apksigner" -type f | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found under $ANDROID_SDK_ROOT/build-tools"
            exit 1
          fi
          echo "Using: $APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          echo "APK signature verification PASSED ✓"

      # ── Forensic check 3: APK contents ────────────────────────────────────────
      # Unzip the APK and grep its bundled JS assets.  This is the definitive
      # proof of what shipped in the release artifact.
      - name: '[Forensic 3] Inspect APK contents (post-assembleRelease)'
        run: |
          echo "=================================================================="
          echo " FORENSIC INSPECTION 3: APK contents"
          echo " Commit: ${{ github.sha }}"
          echo "=================================================================="
          APK=android/app/build/outputs/apk/release/app-release.apk
          EXTRACT_DIR=/tmp/apk-inspect
          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"

          echo "Extracting: $APK → $EXTRACT_DIR"
          unzip -q "$APK" -d "$EXTRACT_DIR"

          echo ""
          echo "APK contents (assets directory):"
          find "$EXTRACT_DIR/assets" -type f 2>/dev/null | sort | head -40
          echo ""

          JS_FILES=$(find "$EXTRACT_DIR/assets" -name "*.js" 2>/dev/null | grep -v '\.map$' | sort)
          if [ -z "$JS_FILES" ]; then
            echo "FAIL: No JS files found in APK assets/"
            exit 1
          fi
          echo "JavaScript files in APK:"
          echo "$JS_FILES" | while read -r f; do echo "  $f ($(du -sh "$f" | cut -f1))"; done
          echo ""

          PASS=true

          # ── mobileSafeFetch (informational for unminified builds) ─────────────
          if grep -qr "mobileSafeFetch" "$EXTRACT_DIR/assets/public/assets/"*.js 2>/dev/null; then
            echo "PASS: mobileSafeFetch found verbatim in APK (unminified/dev build)"
          else
            echo "INFO: mobileSafeFetch not found verbatim (expected in minified builds — see global:{fetch check)"
          fi

          # ── global:{fetch: wrapper (minification-robust primary check) ────────
          # This string survives minification. It proves Supabase createClient
          # is configured with the keepalive-stripping custom fetch function.
          if grep -qrP 'global:\{fetch:' "$EXTRACT_DIR/assets/public/assets/"*.js 2>/dev/null || \
             grep -qrP 'global\s*:\s*\{\s*fetch\s*:' "$EXTRACT_DIR/assets/public/assets/"*.js 2>/dev/null; then
            echo "PASS: global:{fetch: wrapper found in APK bundle — Supabase using custom fetch"
          else
            echo "FAIL: global:{fetch: wrapper NOT found in APK bundle — PR #361 fix may be missing"
            PASS=false
          fi

          # ── keepalive-stripping logic (minification-robust primary check) ─────
          # `"keepalive"in` survives minification because it is a string property
          # lookup.  Its presence proves the mobileSafeFetch stripping logic is
          # compiled into the bundle.
          if grep -qr '"keepalive"in' "$EXTRACT_DIR/assets/public/assets/"*.js 2>/dev/null; then
            echo "PASS: keepalive-stripping logic (\"keepalive\"in) found in APK bundle — PR #361 fix IS present"
          else
            echo "FAIL: keepalive-stripping logic NOT found in APK bundle — PR #361 fix is MISSING"
            PASS=false
          fi

          # ── createClient ─────────────────────────────────────────────────────
          if grep -qr "createClient" "$EXTRACT_DIR/assets/public/assets/"*.js 2>/dev/null; then
            echo "PASS: createClient found in APK bundle"
          else
            echo "FAIL: createClient NOT found in APK bundle"
            PASS=false
          fi

          # ── keepalive:true (the bad pattern — must be absent) ─────────────────
          echo ""
          echo "--- keepalive:true occurrences in APK (must be zero) ---"
          BAD_KEEPALIVE=$(grep -rn 'keepalive\s*:\s*true\|keepalive:true' "$EXTRACT_DIR/assets/public/assets/"*.js 2>/dev/null || true)
          if [ -n "$BAD_KEEPALIVE" ]; then
            echo "FAIL: keepalive:true found in APK bundle — will cause Android WebView crash:"
            echo "$BAD_KEEPALIVE" | head -10
            PASS=false
          else
            echo "PASS: No keepalive:true found in APK bundle"
          fi

          # ── All keepalive occurrences (informational) ─────────────────────────
          echo ""
          echo "--- All keepalive occurrences in APK (informational) ---"
          ALL_KA=$(grep -rn "keepalive" "$EXTRACT_DIR/assets/public/assets/"*.js 2>/dev/null || true)
          if [ -n "$ALL_KA" ]; then
            echo "$ALL_KA" | head -10
            echo "(expected: only the stripping-detection logic above)"
          else
            echo "No keepalive found at all"
          fi

          # ── window.fetch.bind as Supabase global option (the bad old pattern) ──
          # window.fetch.bind MAY appear inside apkDiagnostics.ts (which captures
          # the original fetch before patching).  The only dangerous pattern is it
          # being passed directly as the Supabase global:{fetch: value.
          if grep -qrP 'global:\{fetch:\s*window\.fetch\.bind' "$EXTRACT_DIR/assets/public/assets/"*.js 2>/dev/null; then
            echo "FAIL: Supabase global:{fetch: is set to window.fetch.bind — old broken pattern"
            grep -rn 'global:{fetch:.*window\.fetch\.bind' "$EXTRACT_DIR/assets/public/assets/"*.js | head -5
            PASS=false
          else
            echo "PASS: Supabase global:{fetch: does NOT use window.fetch.bind (OK: apkDiagnostics may use it internally)"
          fi

          # ── Failed to execute ─────────────────────────────────────────────────
          if grep -qr "Failed to execute" "$EXTRACT_DIR/assets/public/assets/"*.js 2>/dev/null; then
            echo "INFO: 'Failed to execute' found in APK bundle (used in error-detection logic)"
            grep -rn "Failed to execute" "$EXTRACT_DIR/assets/public/assets/"*.js | head -5
          else
            echo "INFO: 'Failed to execute' not in APK bundle"
          fi

          # ── errorTracking fetch fallback must not have keepalive ──────────────
          # The keepalive:true check above already covers this globally; no further
          # check needed.  Just log presence of error-reporting code.
          if grep -qr "error-report\|sendBeacon\|\.netlify\/functions" "$EXTRACT_DIR/assets/public/assets/"*.js 2>/dev/null; then
            echo "INFO: errorTracking / sendBeacon code found in APK bundle (keepalive:true already checked above)"
          fi

          # ── Summary ───────────────────────────────────────────────────────────
          echo ""
          echo "=================================================================="
          if [ "$PASS" = true ]; then
            echo " FORENSIC 3 RESULT: PASS — APK bundle looks correct"
            echo "   ✓ global:{fetch: wrapper present (Supabase PR #361 fix)"
            echo "   ✓ keepalive-stripping logic present"
            echo "   ✓ no keepalive:true (errorTracking + Supabase fixed)"
            echo "   ✓ Supabase global:{fetch: not using window.fetch.bind"
            echo " Commit ${{ github.sha }} bundled JS contains the PR #361 fix."
          else
            echo " FORENSIC 3 RESULT: FAIL — see FAIL lines above"
            exit 1
          fi
          echo "=================================================================="

      # ── Upload artifact ────────────────────────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: loadify-market-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      # ── Remove keystore from disk ──────────────────────────────────────────────
      - name: Remove keystore
        if: always()
        run: rm -f android/app/$RELEASE_KEYSTORE_FILENAME
