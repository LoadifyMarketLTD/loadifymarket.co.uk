name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, develop, copilot/build-android-apk]
    paths:
      - 'src/**'
      - 'android/**'
      - 'public/**'
      - 'index.html'
      - 'capacitor.config.ts'
      - 'package*.json'
      - 'vite.config.ts'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      # Opt into Node.js 24 for all JavaScript actions (avoids Node.js 20 deprecation warnings).
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # VITE_* variables are baked into the JavaScript bundle by Vite at build
      # time. Using placeholder values here means every APK ships with wrong
      # credentials — all auth calls fail at runtime. Always supply real values
      # via repository secrets (Settings → Secrets and variables → Actions).
      # Required secrets: VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
      # Keystore filename used consistently across decode + build steps.
      RELEASE_KEYSTORE_FILENAME: loadify-release.keystore

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── Node.js ──────────────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      # ── Guard: require real Supabase credentials ─────────────────────────────
      # VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY are baked into the bundle at
      # build time. If they are missing the APK will contain wrong credentials and
      # all authentication will fail at runtime. Fail the build early so the
      # problem is obvious rather than shipping a broken APK.
      - name: Verify required secrets are set
        run: |
          missing=()
          [ -z "$VITE_SUPABASE_URL" ]      && missing+=("VITE_SUPABASE_URL")
          [ -z "$VITE_SUPABASE_ANON_KEY" ] && missing+=("VITE_SUPABASE_ANON_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "ERROR: The following required secrets are not set:"
            for s in "${missing[@]}"; do echo "  - $s"; done
            echo ""
            echo "Add them under: GitHub repo → Settings → Secrets and variables → Actions"
            echo "Without these, the APK will have broken authentication."
            exit 1
          fi
          echo "All required secrets are present."

      # ── Build web assets ─────────────────────────────────────────────────────
      - name: Build web app
        run: npm run build

      # ── Capacitor sync ───────────────────────────────────────────────────
      - name: Sync Capacitor → Android
        run: npx cap sync android

      # ── Decode keystore ──────────────────────────────────────────────────
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/$RELEASE_KEYSTORE_FILENAME
            echo "Keystore decoded successfully"
          else
            echo "WARNING: ANDROID_KEYSTORE_BASE64 secret is not set. APK will be built unsigned."
          fi

      # ── Java 21 ──────────────────────────────────────────────────────────────
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ── Android SDK ──────────────────────────────────────────────────────────
      - uses: android-actions/setup-android@v3

      # ── Gradle cache ─────────────────────────────────────────────────────────
      - uses: gradle/actions/setup-gradle@v4

      # ── Build release APK ────────────────────────────────────────────────
      - name: Build release APK
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ env.RELEASE_KEYSTORE_FILENAME }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      # ── Remove keystore from disk ─────────────────────────────────────────────
      - name: Remove keystore
        if: always()
        run: rm -f android/app/$RELEASE_KEYSTORE_FILENAME

      # ── Upload artifact ──────────────────────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: loadify-market-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
