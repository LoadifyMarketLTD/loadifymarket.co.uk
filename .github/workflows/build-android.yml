name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, develop, copilot/build-android-apk]
    paths:
      - 'src/**'
      - 'android/**'
      - 'public/**'
      - 'index.html'
      - 'capacitor.config.ts'
      - 'package*.json'
      - 'vite.config.ts'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      # VITE_* variables are baked into the JavaScript bundle by Vite at build
      # time. Using placeholder values here means every APK ships with wrong
      # credentials — all auth calls fail at runtime. Always supply real values
      # via repository secrets (Settings → Secrets and variables → Actions).
      # Required secrets: VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
      # Keystore filename used consistently across decode + build steps.
      RELEASE_KEYSTORE_FILENAME: loadify-release.keystore

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────────
      - uses: actions/checkout@v6

      # ── Node.js ──────────────────────────────────────────────────────────────
      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      # ── Guard: require real Supabase credentials ─────────────────────────────
      # VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY are baked into the bundle at
      # build time. If they are missing the APK will contain wrong credentials and
      # all authentication will fail at runtime. Fail the build early so the
      # problem is obvious rather than shipping a broken APK.
      - name: Verify required secrets are set
        run: |
          missing=()
          [ -z "$VITE_SUPABASE_URL" ]      && missing+=("VITE_SUPABASE_URL")
          [ -z "$VITE_SUPABASE_ANON_KEY" ] && missing+=("VITE_SUPABASE_ANON_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "ERROR: The following required secrets are not set:"
            for s in "${missing[@]}"; do echo "  - $s"; done
            echo ""
            echo "Add them under: GitHub repo → Settings → Secrets and variables → Actions"
            echo "Without these, the APK will have broken authentication."
            exit 1
          fi
          echo "All required secrets are present."

      # ── Build web assets ─────────────────────────────────────────────────────
      - name: Build web app
        run: npm run build

      # ── Capacitor sync ───────────────────────────────────────────────────
      - name: Sync Capacitor → Android
        run: npx cap sync android

      # ── Decode keystore ──────────────────────────────────────────────────
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          [ -z "$ANDROID_KEYSTORE_BASE64" ]    && missing+=("ANDROID_KEYSTORE_BASE64")
          [ -z "$ANDROID_KEYSTORE_PASSWORD" ]  && missing+=("ANDROID_KEYSTORE_PASSWORD")
          [ -z "$ANDROID_KEY_ALIAS" ]          && missing+=("ANDROID_KEY_ALIAS")
          [ -z "$ANDROID_KEY_PASSWORD" ]       && missing+=("ANDROID_KEY_PASSWORD")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "ERROR: The following signing secrets are not set:"
            for s in "${missing[@]}"; do echo "  - $s"; done
            echo ""
            echo "Add them under: GitHub repo → Settings → Secrets and variables → Actions"
            echo "Without these the APK cannot be signed and will not be installable."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/$RELEASE_KEYSTORE_FILENAME
          echo "Keystore decoded successfully."

      # ── Validate keystore ────────────────────────────────────────────────────
      # Runs keytool -list to confirm the decoded file is a valid keystore and
      # that the alias and passwords match before handing off to Gradle.
      - name: Validate keystore
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "Validating keystore: password and alias check..."
          if ! keytool -list \
              -keystore android/app/$RELEASE_KEYSTORE_FILENAME \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -alias "$ANDROID_KEY_ALIAS"; then
            echo ""
            echo "ERROR: Keystore validation failed. Possible causes:"
            echo "  - ANDROID_KEYSTORE_PASSWORD is incorrect"
            echo "  - ANDROID_KEY_ALIAS '${ANDROID_KEY_ALIAS}' does not exist in the keystore"
            echo "  - The base64-decoded keystore file is corrupt"
            echo ""
            echo "To generate a fresh keystore run the 'Generate Release Keystore' workflow."
            exit 1
          fi
          echo "Keystore valid. Alias '${ANDROID_KEY_ALIAS}' confirmed."

      # ── Java 21 ──────────────────────────────────────────────────────────────
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # ── Android SDK ──────────────────────────────────────────────────────────
      - uses: android-actions/setup-android@v4

      # ── Gradle cache ─────────────────────────────────────────────────────────
      - uses: gradle/actions/setup-gradle@v6

      # ── Build release APK ────────────────────────────────────────────────
      - name: Build release APK
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/android/app/${{ env.RELEASE_KEYSTORE_FILENAME }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      # ── List & verify output ──────────────────────────────────────────────────
      - name: List APK output directory
        run: ls -lah android/app/build/outputs/apk/release/

      - name: Verify signed APK exists (hard fail)
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "ERROR: app-release.apk not found — signing was not applied."
            echo "Unsigned or missing artifact:"
            ls -lah android/app/build/outputs/apk/release/ || true
            exit 1
          fi
          echo "Signed APK confirmed: $APK ($(du -sh "$APK" | cut -f1))"

      # ── Verify APK signature (cryptographic) ─────────────────────────────────
      # Uses apksigner from the Android build-tools to confirm the APK carries a
      # valid v1/v2/v3 signature. If this passes the APK will install on-device.
      - name: Verify APK signature
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name "apksigner" -type f | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found under $ANDROID_SDK_ROOT/build-tools"
            exit 1
          fi
          echo "Using: $APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          echo "APK signature verification PASSED ✓"

      # ── Upload artifact ──────────────────────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: loadify-market-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      # ── Remove keystore from disk ─────────────────────────────────────────────
      - name: Remove keystore
        if: always()
        run: rm -f android/app/$RELEASE_KEYSTORE_FILENAME
