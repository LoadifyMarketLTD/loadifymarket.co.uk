name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Restrict the default GITHUB_TOKEN to the minimum permissions needed.
# Individual jobs that require additional access must declare them explicitly.
permissions:
  contents: read

jobs:
  # ── 1. Lint ────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ── 2. Type-check ──────────────────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc -b --noEmit

  # ── 3. Test ────────────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # ── 4. Build ───────────────────────────────────────────────────────────────
  migration-health:
    name: Migration Health
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Validate migration inventory and health script
        run: |
          set -euo pipefail
          test -s supabase/VERIFY_migration_health.sql
          python - <<'PY'
          from pathlib import Path
          import re
          from collections import Counter

          migrations = list(Path('supabase').glob('[0-9]*_*.sql'))
          if not migrations:
              raise SystemExit('No numbered migration files found in supabase/')

          nums = []
          for m in migrations:
              mm = re.match(r'^(\d+)_', m.name)
              if mm:
                  nums.append(int(mm.group(1)))

          if not nums:
              raise SystemExit('No numeric migration prefixes found.')

          nums_sorted = sorted(nums)
          for i in range(1, len(nums_sorted)):
              if nums_sorted[i] < nums_sorted[i - 1]:
                  raise SystemExit(
                      f'Unexpected non-monotonic migration prefix: '
                      f'{nums_sorted[i]} follows {nums_sorted[i-1]}'
                  )

          counts = Counter(nums_sorted)
          bad_dupes = [n for n, c in counts.items() if c > 2]
          if bad_dupes:
              raise SystemExit(
                  f'Migration prefix(es) appear more than twice: {bad_dupes}'
              )

          print(
              f'Migration files checked: {len(nums)}; '
              f'unique prefixes: {len(counts)}; '
              f'first={nums_sorted[0]} last={nums_sorted[-1]}'
          )
          PY

  smoke-critical:
    name: Critical Smoke Tests
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Stripe/Auth/Orders smoke tests
        run: >
          npx vitest run
          netlify/functions/__tests__/register.test.ts
          netlify/functions/__tests__/create-checkout.test.ts
          netlify/functions/__tests__/checkout-safety.test.ts
          netlify/functions/__tests__/stripe-webhook-commission.test.ts

  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, migration-health, smoke-critical]
    permissions:
      contents: read
    env:
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder-anon-key
      VITE_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artefact
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: dist/
