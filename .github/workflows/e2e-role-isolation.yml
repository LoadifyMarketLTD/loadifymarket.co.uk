name: Role Isolation E2E

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: role-isolation-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Role Isolation E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_BUYER_EMAIL: ${{ secrets.E2E_BUYER_EMAIL }}
      E2E_BUYER_PASSWORD: ${{ secrets.E2E_BUYER_PASSWORD }}
      E2E_SELLER_EMAIL: ${{ secrets.E2E_SELLER_EMAIL }}
      E2E_SELLER_PASSWORD: ${{ secrets.E2E_SELLER_PASSWORD }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_FOREIGN_ORDER_ID: ${{ secrets.E2E_FOREIGN_ORDER_ID }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Install pinned Playwright runner without changing lockfile
        run: npm install --no-save --package-lock=false @playwright/test@1.62.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Resolve exact Netlify target
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "E2E_BASE_URL=https://deploy-preview-${{ github.event.pull_request.number }}--loadifymarketcouk.netlify.app" >> "$GITHUB_ENV"
          else
            echo "E2E_BASE_URL=https://loadifymarket.co.uk" >> "$GITHUB_ENV"
          fi

      - name: Wait for Netlify target
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            code="$(curl -sS -L -o /dev/null -w '%{http_code}' "$E2E_BASE_URL/" || true)"
            if [ "$code" -ge 200 ] 2>/dev/null && [ "$code" -lt 400 ] 2>/dev/null; then
              echo "Netlify target ready: $E2E_BASE_URL ($code)"
              exit 0
            fi
            echo "Waiting for Netlify target ($attempt/40, HTTP ${code:-none})"
            sleep 15
          done
          echo "Netlify target did not become ready: $E2E_BASE_URL"
          exit 1

      - name: Run guest and BOLA isolation suite
        run: npx playwright test e2e/role-isolation.spec.ts --project=chromium

      - name: Run credentialed role flow suite
        run: npx playwright test e2e/critical-role-flows.spec.ts --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-role-isolation-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
