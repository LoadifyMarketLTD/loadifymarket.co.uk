        stroke="#7C3AED" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Inner horizontal lines (green) -->
  <line x1="15" y1="12" x2="43" y2="12" stroke="#22C55E" stroke-width="2" stroke-linecap="round"/>
  <line x1="14" y1="18" x2="42" y2="18" stroke="#22C55E" stroke-width="2" stroke-linecap="round"/>
  <line x1="13" y1="23" x2="41.5" y2="23" stroke="#22C55E" stroke-width="2" stroke-linecap="round"/>
  <!-- Wheels (purple) -->
  <circle cx="17" cy="36" r="4.5" stroke="#7C3AED" stroke-width="2.5"/>
  <circle cx="35" cy="36" r="4.5" stroke="#7C3AED" stroke-width="2.5"/>
</svg>
