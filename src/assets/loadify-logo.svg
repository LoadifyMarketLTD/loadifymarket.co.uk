<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" fill="none" role="img" aria-label="Loadify Market">
  <!-- Handle: L-shape from left, going up to basket top-left corner -->
  <path d="M 3,26 L 3,7 L 10,7"
        stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Cart basket: trapezoid with vertical left side, slightly wider at top -->
  <path d="M 10,7 L 44,7 L 42,28 L 10,28 Z"
        stroke="#7C3AED" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Inner horizontal lines (green) -->
  <line x1="12" y1="13" x2="43" y2="13" stroke="#22C55E" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="11.5" y1="18.5" x2="42.5" y2="18.5" stroke="#22C55E" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="11" y1="24" x2="42" y2="24" stroke="#22C55E" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Wheels (purple) -->
  <circle cx="17" cy="37" r="4" stroke="#7C3AED" stroke-width="2.5"/>
  <circle cx="35" cy="37" r="4" stroke="#7C3AED" stroke-width="2.5"/>
</svg>
