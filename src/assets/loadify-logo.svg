<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#7A5910"/>
      <stop offset="20%"  stop-color="#C49020"/>
      <stop offset="50%"  stop-color="#F0C94A"/>
      <stop offset="75%"  stop-color="#D4A030"/>
      <stop offset="100%" stop-color="#7A5910"/>
    </linearGradient>
  </defs>

  <!-- Outer diamond frame -->
  <path d="M50 3 L97 50 L50 97 L3 50 Z"
        stroke="url(#gold)" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Second inner diamond frame -->
  <path d="M50 14 L86 50 L50 86 L14 50 Z"
        stroke="url(#gold)" stroke-width="1.6" stroke-linejoin="round" opacity="0.7"/>

  <!-- Upper double-peak (M shape) — outer -->
  <polyline points="8,50 30,20 50,42 70,20 92,50"
            stroke="url(#gold)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Lower double-valley (W shape) — outer -->
  <polyline points="8,50 30,80 50,58 70,80 92,50"
            stroke="url(#gold)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Inner M echo (depth layer) -->
  <polyline points="20,50 38,28 50,46 62,28 80,50"
            stroke="url(#gold)" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" opacity="0.6"/>

  <!-- Inner W echo (depth layer) -->
  <polyline points="20,50 38,72 50,54 62,72 80,50"
            stroke="url(#gold)" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" opacity="0.6"/>

  <!-- Vertical accent strokes at the two peaks -->
  <line x1="30" y1="20" x2="30" y2="80" stroke="url(#gold)" stroke-width="1.1" opacity="0.45"/>
  <line x1="70" y1="20" x2="70" y2="80" stroke="url(#gold)" stroke-width="1.1" opacity="0.45"/>

  <!-- Centre diamond jewel -->
  <path d="M50 43 L57 50 L50 57 L43 50 Z" stroke="url(#gold)" stroke-width="1.4" opacity="0.8"/>
</svg>
