    <!-- Google Analytics 4
         VITE_GA_MEASUREMENT_ID is substituted by Vite at build time (%VAR% syntax).
         Set VITE_GA_MEASUREMENT_ID=G-XXXXXXXXXX in Netlify environment variables.
         Guard checks for empty string AND the unreplaced placeholder literal to
         ensure the script never fires with an invalid measurement ID. -->
    <script type="module">
      {
        const id = import.meta.env.VITE_GA_MEASUREMENT_ID;
        // If env var was not set, Vite leaves the literal placeholder — skip.
        if (id) {
        window.dataLayer = window.dataLayer || [];
        function gtag() { window.dataLayer.push(arguments); }
        // GDPR: deny all tracking by default until the user grants consent.
        // CookieConsent.tsx calls gtag('consent','update',…) when the user accepts.
        gtag('consent', 'default', {
          ad_storage: 'denied',
          analytics_storage: 'denied',
          wait_for_update: 500,
        });
        gtag('js', new Date());
        gtag('config', id);
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=' + encodeURIComponent(id);
        document.head.appendChild(s);
        }
      }
    </script>
