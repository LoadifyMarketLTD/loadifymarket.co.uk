    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Preconnect / DNS prefetch for above-the-fold external resources -->
    <!-- Unsplash is used for the LCP hero image and category thumbnails.
         No `crossorigin` here: the <img> element does not set crossorigin,
         so img fetches use "no-cors" mode.  A CORS preconnect creates a
         separate connection that cannot be reused for no-cors requests. -->
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <!-- Google Fonts — loaded asynchronously to avoid blocking first render.
         The preload link converts itself to a stylesheet once the resource is
         fetched, which avoids the "preloaded but not used" browser warning that
         the separate preload + media="print" two-link pattern can trigger.
         The <noscript> fallback covers JS-disabled environments. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
    </noscript>

    <!-- Preload the LCP hero image (CinematicHero background – above the fold).
         IMPORTANT: imagesrcset, imagesizes, and href must match CinematicHero.tsx
         exactly, and crossorigin must NOT be set here because the <img> element
         has no crossorigin attribute.  A crossorigin mismatch means the browser
         uses a different cache key for the preload vs the actual request and
         ends up downloading the image twice, severely hurting LCP.
         Matching values taken directly from CinematicHero.tsx. -->
    <link
      rel="preload"
      as="image"
      href="https://images.unsplash.com/photo-1553413077-190dd305871c?w=768&q=65&auto=format&fit=max&fm=webp"
      imagesrcset="
        https://images.unsplash.com/photo-1553413077-190dd305871c?w=480&q=65&auto=format&fit=max&fm=webp 480w,
        https://images.unsplash.com/photo-1553413077-190dd305871c?w=640&q=65&auto=format&fit=max&fm=webp 640w,
        https://images.unsplash.com/photo-1553413077-190dd305871c?w=768&q=65&auto=format&fit=max&fm=webp 768w,
        https://images.unsplash.com/photo-1553413077-190dd305871c?w=1280&q=65&auto=format&fit=max&fm=webp 1280w"
      imagesizes="(max-width: 480px) 100vw, (max-width: 1023px) 100vw, 640px"
    />
