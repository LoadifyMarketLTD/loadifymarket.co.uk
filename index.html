    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Preconnect / DNS prefetch for above-the-fold external resources -->
    <!-- Unsplash is used for the LCP hero image and category thumbnails.
         No `crossorigin` here: the <img> element does not set crossorigin,
         so img fetches use "no-cors" mode.  A CORS preconnect creates a
         separate connection that cannot be reused for no-cors requests. -->
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <!-- Preload LCP hero image to start the fetch before the JS bundle executes.
         fetchpriority="high" tells the browser this is the most important image.
         The URL mirrors the one used in Index.tsx hero <img src>. -->
    <link
      rel="preload"
      as="image"
      href="https://images.unsplash.com/photo-1607082348824-0a96f2a4b9da?w=900&auto=format&fit=crop"
      fetchpriority="high"
    />
    <!-- Google Fonts — loaded asynchronously to avoid blocking first render.
         The preload link converts itself to a stylesheet once the resource is
         fetched, which avoids the "preloaded but not used" browser warning that
         the separate preload + media="print" two-link pattern can trigger.
         The <noscript> fallback covers JS-disabled environments. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
    </noscript>
