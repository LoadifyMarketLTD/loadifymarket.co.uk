    <!-- Preload the LCP hero image (displayed above the fold on the homepage).
         A single default URL is used here because <link rel="preload"> with
         imagesrcset/imagesizes has limited browser support; the srcset on the
         <img> element inside CinematicHero still allows responsive loading. -->
    <link
      rel="preload"
      as="image"
      href="https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?w=1280&q=70&auto=format&fit=max&fm=webp"
      crossorigin
    />

        "contactType": "Customer Service",

        "availableLanguage": ["English"]
      },
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "101 Cornelian Street",
        "addressLocality": "Blackburn",
        "postalCode": "BB1 9QL",

      },

    <!-- Structured Data - Website -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Loadify Market Ltd",
      "url": "https://loadifymarket.co.uk",
      "description": "UK multi-category marketplace for products, bulk lots and pallets",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://loadifymarket.co.uk/catalog?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Structured Data - Marketplace -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Store",
      "name": "Loadify Market Ltd",
      "image": "https://loadifymarket.co.uk/og-image.jpg",
      "url": "https://loadifymarket.co.uk",
      "telephone": "+44",
      "priceRange": "££-££££",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "101 Cornelian Street",
        "addressLocality": "Blackburn",
        "postalCode": "BB1 9QL",
        "addressCountry": "GB"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": 53.7500,
        "longitude": -2.4800
      },
      "openingHoursSpecification": {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],
        "opens": "00:00",
        "closes": "23:59"
      },
      "offers": {
        "@type": "AggregateOffer",
        "priceCurrency": "GBP",
        "lowPrice": "1",
        "highPrice": "100000",
        "offerCount": "1000"
      }
    }
    </script>
