[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# ─── Edge Functions ───────────────────────────────────────────────────────────
# security-headers runs at the Netlify edge (Deno runtime) and adds
# Strict-Transport-Security and Permissions-Policy to every HTML response.
# The edge function also has in-source config (config.path = '/*'), but the
# explicit registration below ensures it is always active regardless of
# Netlify CLI version.
[[edge_functions]]
  function = "security-headers"
  path = "/*"

# ─── Security Headers (applied to all responses) ─────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent clickjacking
    X-Frame-Options = "DENY"
    # Prevent MIME-type sniffing
    X-Content-Type-Options = "nosniff"
    # Control referrer information
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Restrict browser feature access
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self)"
    # Content-Security-Policy: enforced policy.
    # 'unsafe-inline' is retained for script-src (JSON-LD <script> blocks) and
    # style-src (Tailwind-generated inline styles). These are deliberate trade-offs
    # documented in the security review; the policy still blocks all non-allowlisted
    # origins, providing meaningful cross-site injection protection.
    # The report-uri directive sends violation reports to the csp-report function
    # so they can be monitored without disrupting users.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co https://api.stripe.com wss://*.supabase.co; frame-src https://js.stripe.com https://hooks.stripe.com; object-src 'none'; base-uri 'self'; form-action 'self'; report-uri /.netlify/functions/csp-report"

# ─── Cache: static assets (immutable hashed filenames from Vite) ──────────────
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ─── Cache: HTML — short duration, must revalidate ───────────────────────────
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ─── Cache: images — 1 year (images are versioned by filename; originals kept alongside) ────
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/**"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ─── Cache: root-level image files (hero, og-image, etc.) ───────────────────
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ─── Cache: SVG icons / branding assets ──────────────────────────────────────
[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ─── Cache: payment icons ─────────────────────────────────────────────────────
[[headers]]
  for = "/payment-icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ─── Android App Links verification file ─────────────────────────────────────
# Must be served as application/json with HTTP 200 (no redirects, no HTML).
# Google's Digital Asset Links verifier re-fetches this on every install, so
# no-store prevents stale cached versions being served after the SHA-256 is updated.
[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "no-store"
    Access-Control-Allow-Origin = "*"

# ─── Cache: PWA manifest ─────────────────────────────────────────────────────
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "application/manifest+json"

# ─── Cache: Service worker — no cache so updates are picked up immediately ───
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

# ─── Cache: branding directory ───────────────────────────────────────────────
[[headers]]
  for = "/branding/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
